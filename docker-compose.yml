version: "3.8"

services:
  api:
    build: .
    container_name: drug-rag-api
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  ui:
    build: .
    container_name: drug-rag-ui
    command: streamlit run src/ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/ask
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - api
    volumes:
      - ./data:/app/data
