name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build local index from sample data
        run: |
          python -c "from pathlib import Path; from src.ingest.indexer import index_labels; index_labels(Path('data/sample'))"

      - name: Run pytest test suite
        run: |
          python -m pytest tests/ -v

      - name: Run evaluation harness in Demo Mode
        run: |
          python evals/run.py --demo --output-file evals/results.md

      - name: Archive evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evals/results.md
